name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: pull requests from forks run this too.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for the secrets scan
          persist-credentials: false
      - uses: jdx/mise-action@v5 # java, gradle, just, betterleaks from mise.toml
      - uses: gradle/actions/setup-gradle@v5
      - run: just ci

  native:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: jdx/mise-action@v5 # only gradle; the JDK comes from setup-graalvm
        with:
          install_args: gradle
      - uses: gradle/actions/setup-gradle@v5
      - run: gradle nativeCompile
      - name: Smoke test
        shell: bash
        run: build/native/nativeCompile/wowfam --version
      - uses: actions/upload-artifact@v7
        with:
          name: wowfam-${{ runner.os }}-${{ runner.arch }}
          path: build/native/nativeCompile/wowfam*
