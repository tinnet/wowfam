name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: pull requests from forks run this too.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # full history for the secrets scan
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.10 # java, gradle, just, betterleaks from mise.toml
      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-provider: basic # the MIT one; the default is proprietary
      - run: just ci

  # Every action is pinned to a commit in actions.lock; fail if a workflow uses one that isn't.
  actions-lock:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify

  native:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: graalvm/setup-graalvm@v1.6.10
        with:
          java-version: "25"
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: jdx/mise-action@v5.2.10 # only gradle; the JDK comes from setup-graalvm
        with:
          install_args: gradle
      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-provider: basic # the MIT one; the default is proprietary
      - run: gradle nativeCompile
      - name: Smoke test
        shell: bash
        run: build/native/nativeCompile/wowfam --version
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: wowfam-${{ runner.os }}-${{ runner.arch }}
          path: build/native/nativeCompile/wowfam*
