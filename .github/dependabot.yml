version: 2
updates:
  # Bumps the actions in the workflows and their pins in actions.lock in one pull request.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # let a new release settle (or get pulled) before we take it
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # v6 moved its caching into a proprietary component under Gradle's terms of use.
      - dependency-name: gradle/actions
        versions: [">= 6"]
