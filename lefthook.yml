# Git hooks; `lefthook install` (or `just setup`) activates them.

pre-commit:
  jobs:
    - name: secrets
      run: betterleaks git --pre-commit --staged --no-banner --redact -v
    - name: format
      glob: "{*.java,justfile}"
      run: just fmt
      stage_fixed: true

pre-push:
  jobs:
    - name: test
      run: just test
