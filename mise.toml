# Dev tools for this repo. `mise install` (or `just setup`) gets everything.
# Gradle itself comes from ./gradlew.

[tools]
# A GraalVM, so the same JDK runs the build, the tests and `nativeCompile`.
java = "oracle-graalvm-25"
just = "1.59.0"
lefthook = "2.2.2"
# 1.x is the stable line; 2.0 is still a release candidate.
betterleaks = "1.10.0"
