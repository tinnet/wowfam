# Dev tools for this repo. `mise install` (or `just setup`) gets everything.

[tools]
# Gradle runs on the java below; there is no wrapper.
gradle = "9.9.0"
# A GraalVM, so the same JDK runs the build, the tests and `nativeCompile`.
java = "oracle-graalvm-25"
just = "1.59.0"
lefthook = "2.2.2"
# 1.x is the stable line; 2.0 is still a release candidate.
betterleaks = "1.10.0"
# Release notes and CHANGELOG.md from the Conventional Commits.
git-cliff = "2.14.2"
# Lints and renders the Mermaid diagrams in docs/ (the binary is merman-cli).
"github:Latias94/merman" = "0.10.0"
